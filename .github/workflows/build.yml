name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source checks
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/check_source.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build application and installer
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/deliverables"
      - name: Run Windows interaction checks
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts/deliverables/FreshOS.exe'
          $report = Join-Path $env:GITHUB_WORKSPACE 'artifacts/test-results'
          $process = Start-Process $exe -ArgumentList @('--self-test', '--report-directory', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Interaction tests timed out.' }
          if ($process.ExitCode -ne 0) {
            $failure = Get-Content "$report/failure.txt" -Raw -ErrorAction SilentlyContinue
            if (-not $failure) { $failure = "Interaction test process exited with code $($process.ExitCode) without a report." }
            Write-Host ('::error::' + $failure.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            throw 'Interaction tests failed.'
          }
          Get-Content "$report/interaction-tests.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreshOS-test-results
          path: artifacts/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: FreshOS-win-x64
          path: artifacts/deliverables/*.exe
